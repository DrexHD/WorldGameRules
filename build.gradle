import org.jetbrains.changelog.Changelog

plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
    id "me.modmuss50.mod-publish-plugin" version "2.2.1"
}

version = "${mod_version}+${minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url "https://maven.nucleoid.xyz/" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.ladysnake.org/releases" }
}

loom {
    runConfigs.all {
        ideConfigGenerated(true)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation include("me.lucko:fabric-permissions-api:${project.permission_api_version}")
    implementation include("eu.pb4:placeholder-api:${project.placeholder_api_version}")
    implementation include("xyz.nucleoid:server-translations-api:${project.server_translations_api_version}")
    // Compat
    compileOnly("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

publishMods {
    file = jar.archiveFile
    changelog = fetchChangelog()
    type = STABLE
    displayName = "WorldGameRules ${version.get()}"
    modLoaders.add("fabric")
    modLoaders.add("quilt")
    modrinth {
        projectId = "Eie2vf4W"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.addAll(project.modrinth_minecraft_versions.split(", "))
        requires("fabric-api")
    }
    curseforge {
        projectId = "1039751"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.addAll(project.curseforge_minecraft_versions.split(", "))
        requires("fabric-api")
        client = true
        server = true
    }
    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = providers.environmentVariable("GITHUB_REPOSITORY").getOrElse("DrexHD/WorldGameRules")
        commitish = providers.environmentVariable("GITHUB_REF_NAME").getOrElse("main")
    }
}

private String fetchChangelog() {
    def log = rootProject.extensions.getByType(org.jetbrains.changelog.ChangelogPluginExtension)
    if (log.has(project.mod_version)) {
        return log.renderItem(
                log.get(project.mod_version).withHeader(false),
                Changelog.OutputType.MARKDOWN
        )
    } else {
        return ""
    }
}